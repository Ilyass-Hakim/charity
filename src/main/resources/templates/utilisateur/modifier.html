<!DOCTYPE html>
<html th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title th:text="#{modifier.title} + ' - CharityHub'">Edit Profile - CharityHub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#005440",
                        "secondary": "#a8380f",
                        "background": "#f8f9fa",
                        "on-background": "#191c1d",
                        "surface": "#f8f9fa",
                        "on-surface": "#191c1d",
                        "outline-variant": "#bec9c3",
                        "surface-variant": "#e1e3e4",
                        "on-surface-variant": "#3f4944",
                        "primary-container": "#0f6e56",
                        "on-primary": "#ffffff",
                        "secondary-container": "#fd7549",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffdad4",
                        "on-tertiary-fixed-variant": "#743329",
                        "tertiary": "#78352b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "md": "16px",
                        "xl": "32px",
                        "container-max": "1280px",
                        "lg": "24px",
                        "gutter": "24px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "display": ["DM Sans"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "button": ["Inter"],
                        "label-caps": ["Inter"],
                        "h1": ["DM Sans"],
                        "h3": ["DM Sans"],
                        "h2": ["DM Sans"]
                    }
                }
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        [lang='ar'] { font-family: 'Noto Sans Arabic', sans-serif; }
    </style>
</head>

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">

    <!-- TopNavBar -->
    <header class="bg-surface sticky top-0 z-50 border-b border-outline-variant w-full">
        <div class="flex justify-between items-center px-lg py-sm max-w-container-max mx-auto h-16">
            <div class="flex items-center gap-xl">
                <a th:href="@{/}" class="font-h2 text-h2 font-bold text-primary no-underline">CharityHub</a>
                <nav class="hidden md:flex gap-lg items-center">
                    <a class="text-on-surface-variant font-body-md hover:text-primary transition-colors no-underline" th:href="@{/}" th:text="#{nav.home}">Home</a>
                    <a class="text-on-surface-variant font-body-md hover:text-primary transition-colors no-underline" th:href="@{/actions}" th:text="#{nav.explore}">Explore</a>
                    <a class="text-on-surface-variant font-body-md hover:text-primary transition-colors no-underline" th:href="@{/about}" th:text="#{nav.about}">About</a>
                </nav>
            </div>
            <div class="flex items-center gap-md">
                <!-- Language Toggle -->
                <div class="flex gap-2 mr-4 text-sm font-bold text-primary">
                    <a th:href="@{'' (lang='en')}" class="hover:underline no-underline" th:classappend="${#locale.language == 'en' ? 'text-secondary font-black' : ''}">EN</a>
                    <span class="text-outline opacity-30">|</span>
                    <a th:href="@{'' (lang='fr')}" class="hover:underline no-underline" th:classappend="${#locale.language == 'fr' ? 'text-secondary font-black' : ''}">FR</a>
                    <span class="text-outline opacity-30">|</span>
                    <a th:href="@{'' (lang='ar')}" class="hover:underline no-underline" th:classappend="${#locale.language == 'ar' ? 'text-secondary font-black' : ''}">AR</a>
                </div>
                <a th:href="@{/utilisateur/profil}" class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant transition-transform active:scale-95">
                    <img th:src="${utilisateur.photoProfil != null ? utilisateur.photoProfil : 'https://ui-avatars.com/api/?name=' + dto.prenom + '+' + dto.nom + '&background=005440&color=fff'}" class="w-full h-full object-cover" />
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-xl max-w-4xl mx-auto w-full flex-grow">
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-xs text-on-surface-variant font-body-sm mb-md">
            <a class="hover:text-primary transition-colors no-underline" th:href="@{/}" th:text="#{nav.home}">Home</a>
            <span class="material-symbols-outlined text-[16px]">chevron_right</span>
            <a class="hover:text-primary transition-colors no-underline" th:href="@{/utilisateur/profil}" th:text="#{nav.profile}">Profile</a>
            <span class="material-symbols-outlined text-[16px]">chevron_right</span>
            <span class="text-primary font-bold" th:text="#{modifier.title}">Edit Profile</span>
        </nav>

        <h1 class="font-h1 text-h1 text-on-surface mb-xl" th:text="#{profile.title}">Account Settings</h1>

        <div class="bg-white border border-outline-variant rounded-xl p-lg shadow-sm">
            <form th:action="@{/utilisateur/profil/modifier}" th:object="${dto}" method="post" enctype="multipart/form-data" class="space-y-xl">
                
                <!-- Profile Picture -->
                <div class="flex flex-col items-center gap-md py-md border-b border-outline-variant">
                    <div class="relative">
                        <img id="preview" class="w-32 h-32 rounded-full object-cover border-4 border-primary/10 shadow-md" 
                            th:src="${utilisateur.photoProfil != null ? utilisateur.photoProfil : 'https://ui-avatars.com/api/?name=' + dto.prenom + '+' + dto.nom + '&size=128&background=005440&color=fff'}"/>
                        <label for="photoFile" class="absolute bottom-1 right-1 bg-primary text-white p-2 rounded-full shadow-lg border-2 border-white hover:bg-primary-container cursor-pointer transition-colors">
                            <span class="material-symbols-outlined" style="font-size: 18px;">photo_camera</span>
                            <input type="file" id="photoFile" name="photoFile" class="hidden" accept="image/*" onchange="previewImage(this)"/>
                        </label>
                    </div>
                    <div class="text-center">
                        <p class="font-h3 text-h3" th:text="#{profile.photo}">Profile Photo</p>
                        <p class="text-on-surface-variant font-body-sm" th:text="#{profile.photo_desc}">JPG, GIF or PNG. Max 2MB.</p>
                    </div>
                </div>

                <!-- Personal Info -->
                <div class="space-y-lg">
                    <h2 class="font-h2 text-h2 text-primary border-b border-outline-variant pb-xs" th:text="#{profile.personal_info}">Personal Information</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
                        <div class="flex flex-col gap-xs">
                            <label class="font-label-caps text-label-caps text-on-surface-variant" th:text="#{profile.firstname}">First Name</label>
                            <input th:field="*{prenom}" class="bg-surface border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary outline-none" type="text" required />
                        </div>
                        <div class="flex flex-col gap-xs">
                            <label class="font-label-caps text-label-caps text-on-surface-variant" th:text="#{profile.lastname}">Last Name</label>
                            <input th:field="*{nom}" class="bg-surface border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary outline-none" type="text" required />
                        </div>
                    </div>

                    <div class="flex flex-col gap-xs">
                        <label class="font-label-caps text-label-caps text-on-surface-variant" th:text="#{profile.email}">Email</label>
                        <input th:field="*{email}" class="bg-surface-variant text-on-surface-variant border border-outline-variant rounded-lg p-md cursor-not-allowed italic" readonly type="email" />
                    </div>

                    <div class="flex flex-col gap-xs">
                        <label class="font-label-caps text-label-caps text-on-surface-variant" th:text="#{profile.phone}">Phone</label>
                        <input th:field="*{telephone}" class="bg-surface border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary outline-none" type="tel" placeholder="+212..." />
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex flex-col sm:flex-row justify-end gap-md pt-xl border-t border-outline-variant">
                    <a th:href="@{/utilisateur/profil}" class="px-xl py-sm rounded-lg border border-primary text-primary font-bold hover:bg-surface-variant text-center no-underline" th:text="#{common.cancel}">Cancel</a>
                    <button type="submit" class="px-xl py-sm rounded-lg bg-secondary text-white font-bold hover:bg-secondary-container shadow-md transition-transform active:scale-95" th:text="#{modifier.save}">Save Changes</button>
                </div>
            </form>
        </div>

        <!-- Security Warning -->
        <div class="mt-lg p-md bg-tertiary-fixed rounded-lg flex gap-md items-start border border-outline-variant">
            <span class="material-symbols-outlined text-tertiary">info</span>
            <div>
                <p class="font-label-caps text-label-caps text-on-tertiary-fixed-variant" th:text="#{profile.security_info}">Security Information</p>
                <p class="font-body-sm text-on-tertiary-fixed-variant" th:text="#{profile.security_desc}">Password changes require re-login.</p>
            </div>
        </div>
    </main>

    <footer class="bg-on-background text-white py-lg border-t border-outline-variant mt-auto">
        <div class="max-w-container-max mx-auto text-center px-md">
            <p class="text-xs opacity-70">© 2026 CharityHub. <span th:text="#{footer.rights}">All rights reserved.</span></p>
        </div>
    </footer>

    <script>
        function previewImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
