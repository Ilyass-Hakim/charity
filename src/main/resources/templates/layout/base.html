<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{app.title}">Gestion Charite</title>
    <!-- We will use a CDN for Bootstrap since webjars might require extra config if missing -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 70px; }
    </style>
    <th:block th:insert="~{::extraCss} ?: _"></th:block>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}" th:text="#{app.name}">Charite App</a>
        <div class="navbar-nav ms-auto align-items-center">
            
            <a class="nav-link" th:href="@{/actions}" th:text="#{nav.explore}">Explorer</a>
            
            <div sec:authorize="isAuthenticated()">
                <a class="nav-link" th:href="@{/utilisateur/profil}" th:text="#{nav.profile}">Mon Profil</a>
            </div>
            
            <div sec:authorize="hasRole('SUPER_ADMIN')">
                <a class="nav-link" th:href="@{/admin/dashboard}" th:text="#{nav.admin}">Admin</a>
            </div>
            
            <div sec:authorize="hasRole('ORG_ADMIN')">
                <a class="nav-link" th:href="@{/organisation/dashboard}" th:text="#{nav.dashboard}">Dashboard</a>
            </div>
            
            <div sec:authorize="!isAuthenticated()">
                <a class="btn btn-outline-light btn-sm ms-2" th:href="@{/auth/login}" th:text="#{nav.login}">Connexion</a>
            </div>
            
            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/auth/logout}" method="post" class="d-inline">
                    <button class="btn btn-outline-light btn-sm ms-2" th:text="#{nav.logout}">Deconnexion</button>
                </form>
            </div>
            
            <!-- Selecteur de langue -->
            <div class="ms-3 d-flex gap-2">
                <a th:href="@{/(lang=fr)}" class="text-white text-decoration-none">FR</a>
                <span class="text-white">|</span>
                <a th:href="@{/(lang=ar)}" class="text-white text-decoration-none">AR</a>
            </div>
        </div>
    </div>
</nav>

<!-- Flash messages -->
<div class="container mt-3">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>

<!-- Contenu de la page -->
<main class="container mt-4">
    <th:block th:insert="~{::content}"></th:block>
</main>

<footer class="bg-dark text-light mt-5 py-4">
    <div class="container text-center">
        <p th:text="#{footer.copyright}">2024 Charite App</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:insert="~{::extraJs} ?: _"></th:block>
</body>
</html>
