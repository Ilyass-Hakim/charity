<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Faire un Don - CharityHub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#005440",
                      "on-primary": "#ffffff",
                      "secondary": "#a8380f",
                      "on-secondary": "#ffffff",
                      "background": "#f8f9fa",
                      "on-background": "#191c1d",
                      "surface": "#f8f9fa",
                      "on-surface": "#191c1d",
                      "surface-variant": "#e1e3e4",
                      "on-surface-variant": "#3f4944",
                      "outline": "#6f7a74",
                      "outline-variant": "#bec9c3",
                      "primary-container": "#0f6e56",
                      "on-primary-container": "#9aedcf",
                      "secondary-container": "#fd7549",
                      "on-secondary-container": "#661a00",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-low": "#f3f4f5",
                      "primary-fixed-dim": "#84d6b9"
              },
              "borderRadius": {
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "32px",
                      "md": "16px",
                      "sm": "12px",
                      "xs": "8px",
                      "lg": "24px",
                      "base": "4px"
              },
              "fontFamily": {
                      "h1": ["DM Sans"],
                      "h2": ["DM Sans"],
                      "h3": ["DM Sans"],
                      "body-md": ["Inter"],
                      "body-sm": ["Inter"],
                      "label-caps": ["Inter"],
                      "button": ["Inter"]
              },
              "fontSize": {
                      "h1": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "button": ["16px", {"lineHeight": "1", "fontWeight": "600"}]
              }
            },
          },
        }
      </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">

<main class="flex-grow flex items-center justify-center p-md md:p-xl">
    <div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl border border-surface-variant p-lg md:p-xl flex flex-col gap-xl shadow-xl">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-surface-variant pb-md">
            <div>
                <h1 class="font-h2 text-h2 text-primary">Make a Donation</h1>
                <p class="font-body-sm text-body-sm text-on-surface-variant mt-xs" th:text="'Soutenir : ' + ${action.titre}">Support the campaign</p>
            </div>
            <a th:href="@{/actions/{id}(id=${action.id})}" aria-label="Close" class="text-on-surface-variant hover:text-primary transition-colors no-underline">
                <span class="material-symbols-outlined">close</span>
            </a>
        </div>

        <!-- Progress Indicator -->
        <div class="flex items-center gap-sm">
            <div class="flex-1 flex flex-col gap-xs">
                <span class="font-label-caps text-label-caps text-primary">Step 1</span>
                <div class="h-2 rounded-full bg-surface-variant overflow-hidden">
                    <div class="h-full bg-primary w-full"></div>
                </div>
            </div>
            <div class="flex-1 flex flex-col gap-xs">
                <span class="font-label-caps text-label-caps text-on-surface-variant">Step 2</span>
                <div class="h-2 rounded-full bg-surface-variant overflow-hidden">
                    <div class="h-full bg-surface-variant w-0"></div>
                </div>
            </div>
            <div class="flex-1 flex flex-col gap-xs">
                <span class="font-label-caps text-label-caps text-on-surface-variant">Step 3</span>
                <div class="h-2 rounded-full bg-surface-variant overflow-hidden">
                    <div class="h-full bg-surface-variant w-0"></div>
                </div>
            </div>
        </div>

        <!-- Step 1: Select Amount Content -->
        <div class="flex flex-col gap-lg">
            <h2 class="font-h3 text-h3">Choisir le montant</h2>
            <div class="grid grid-cols-3 gap-sm">
                <button type="button" onclick="setAmount(50)" class="amount-btn bg-surface-container-lowest border border-surface-variant hover:bg-surface-container-low text-on-background font-button text-button rounded-lg py-sm transition-colors">
                    50 MAD
                </button>
                <button type="button" onclick="setAmount(100)" class="amount-btn bg-[#F0F9F7] border border-primary text-primary font-button text-button rounded-lg py-sm transition-colors">
                    100 MAD
                </button>
                <button type="button" onclick="setAmount(200)" class="amount-btn bg-surface-container-lowest border border-surface-variant hover:bg-surface-container-low text-on-background font-button text-button rounded-lg py-sm transition-colors">
                    200 MAD
                </button>
                <button type="button" onclick="setAmount(500)" class="amount-btn bg-surface-container-lowest border border-surface-variant hover:bg-surface-container-low text-on-background font-button text-button rounded-lg py-sm transition-colors">
                    500 MAD
                </button>
                <button type="button" onclick="setAmount(1000)" class="amount-btn bg-surface-container-lowest border border-surface-variant hover:bg-surface-container-low text-on-background font-button text-button rounded-lg py-sm transition-colors">
                    1000 MAD
                </button>
                <div class="relative">
                    <span class="absolute left-sm top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant text-xs">MAD</span>
                    <input id="custom-amount" class="w-full bg-surface-container-lowest border border-surface-variant rounded-lg py-sm pl-10 pr-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim/20 font-body-md text-body-md text-on-background" placeholder="Autre" type="number"/>
                </div>
            </div>
            <div class="flex items-center gap-sm mt-xs">
                <input class="rounded border-surface-variant text-primary focus:ring-primary-fixed-dim/20" id="monthly" type="checkbox"/>
                <label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="monthly">Faire de ceci un don mensuel récurrent</label>
            </div>
        </div>

        <!-- Action Area -->
        <div class="flex justify-between items-center pt-md border-t border-surface-variant mt-auto">
            <a th:href="@{/actions/{id}(id=${action.id})}" class="font-button text-button text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs no-underline">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
                Retour
            </a>
            <button type="button" class="bg-secondary-container text-on-secondary font-button text-button rounded-lg px-xl py-sm hover:bg-secondary transition-colors flex items-center gap-xs shadow-md">
                Continuer au Paiement
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
        </div>
    </div>
</main>

<script>
    function setAmount(amount) {
        document.getElementById('custom-amount').value = amount;
        // Logic to highlight selected button could be added here
        document.querySelectorAll('.amount-btn').forEach(btn => {
            btn.classList.remove('bg-[#F0F9F7]', 'border-primary', 'text-primary');
            btn.classList.add('bg-surface-container-lowest', 'border-surface-variant', 'text-on-background');
            if (btn.innerText.includes(amount)) {
                btn.classList.remove('bg-surface-container-lowest', 'border-surface-variant', 'text-on-background');
                btn.classList.add('bg-[#F0F9F7]', 'border-primary', 'text-primary');
            }
        });
    }
</script>

</body>
</html>
