# Profil de Production
spring.application.name=charite-app
server.port=8080

# ===== BASE DE DONNEES POSTGRESQL (prod) =====
spring.datasource.url=${DB_PROD_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_PROD_USERNAME}
spring.datasource.password=${DB_PROD_PASSWORD}
spring.h2.console.enabled=false

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== MONGODB =====
spring.data.mongodb.uri=${MONGO_PROD_URI:mongodb://localhost:27017/charite}

# ===== LOGGING =====
logging.level.com.charite=INFO
logging.level.org.springframework.security=WARN
