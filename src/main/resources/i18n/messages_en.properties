# About Page
about.hero_title=Empowering global change through transparent giving.
about.hero_subtitle=We bridge the gap between compassionate donors and verified global causes, ensuring every penny creates measurable impact.
about.story_label=OUR STORY
about.story_title=From local vision to global transparency
about.story_p1=CharityHub started in a small community center with a single question: "Where does my money actually go?" We realized trust is the most valuable currency in philanthropy. Since then, we've built a platform that combines cutting-edge tracking technology with grassroots empathy.
about.story_p2=Today, we support thousands of certified organizations, providing donors with real-time updates and data-driven impact reports. Our mission remains the same: to make giving as clear as it is compassionate.
about.milestones=Measurable Milestones
about.milestones_sub=Real numbers from real people making a difference.
about.values_title=Our Core Values
about.transparency_title=Transparency
about.transparency_desc=We provide open-access reporting so you know exactly where your contributions are being deployed in real-time.
about.community_title=Community
about.community_desc=Change happens together. We foster a global ecosystem of donors, volunteers, and local activists.
about.accountability_title=Accountability
about.accountability_desc=We strictly vet every organization and project to ensure ethical standards and long-term sustainable results.
about.cta_title=Ready to make an impact?
about.cta_desc=Join our mission and start your transparent giving journey today. Create your account and discover the causes that matter to you.
about.join=Join Our Mission

