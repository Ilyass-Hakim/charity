# About Page
about.hero_title=Favoriser le changement mondial grâce à des dons transparents.
about.hero_subtitle=Nous comblons le fossé entre les donateurs compatissants et les causes mondiales vérifiées, en veillant à ce que chaque centime crée un impact mesurable.
about.story_label=NOTRE HISTOIRE
about.story_title=D'une vision locale à une transparence mondiale
about.story_p1=CharityHub a commencé dans un petit centre communautaire avec une seule question : « Où va réellement mon argent ? » Nous avons réalisé que la confiance est la monnaie la plus précieuse de la philanthropie. Depuis alors, nous avons construit une plateforme qui combine une technologie de suivi de pointe avec l'empathie de terrain.
about.story_p2=Aujourd'hui, nous soutenons des milliers d'organisations certifiées, fournissant aux donateurs des mises à jour en temps réel et des rapports d'impact basés sur des données. Notre mission reste la même : rendre le don aussi clair qu'il est compatissant.
about.milestones=Jalons Mesurables
about.milestones_sub=Des chiffres réels provenant de vraies personnes qui font la différence.
about.values_title=Nos Valeurs Fondamentales
about.transparency_title=Transparence
about.transparency_desc=Nous fournissons des rapports en accès libre afin que vous sachiez exactement où vos contributions sont déployées en temps réel.
about.community_title=Communauté
about.community_desc=Le changement se fait ensemble. Nous favorisons un écosystème mondial de donateurs, de bénévoles et d'activistes locaux.
about.accountability_title=Responsabilité
about.accountability_desc=Nous examinons rigoureusement chaque organisation et projet pour garantir les normes éthiques et les résultats durables à long terme.
about.cta_title=Prêt à faire un impact ?
about.cta_desc=Rejoignez notre mission et commencez votre voyage de don transparent dès aujourd'hui. Créez votre compte et découvrez les causes qui vous tiennent à cœur.
about.join=Rejoindre Notre Mission

