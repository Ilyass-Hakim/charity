# About Page
about.hero_title=تمكين التغيير العالمي من خلال العطاء الشفاف.
about.hero_subtitle=نحن نسد الفجوة بين المتبرعين المتعاطفين والقضايا العالمية الموثوقة، لضمان أن كل قرش يحدث تأثيراً ملموساً.
about.story_label=قصتنا
about.story_title=من رؤية محلية إلى شفافية عالمية
about.story_p1=بدأت CharityHub في مركز مجتمعي صغير بسؤال واحد: "أين تذهب أموالي حقاً؟" أدركنا أن الثقة هي العملة الأكثر قيمة في العمل الخيري. منذ ذلك الحين، قمنا ببناء منصة تجمع بين تقنيات التتبع المتطورة والتعاطف الشعبي.
about.story_p2=اليوم، ندعم الآلاف من المنظمات المعتمدة، ونزود المتبرعين بتحديثات في الوقت الفعلي وتقارير تأثير تعتمد على البيانات. تظل مهمتنا كما هي: جعل العطاء واضحاً بقدر ما هو رحيم.
about.milestones=إنجازات ملموسة
about.milestones_sub=أرقام حقيقية من أشخاص حقيقيين يصنعون الفرق.
about.values_title=قيمنا الأساسية
about.transparency_title=الشفافية
about.transparency_desc=نحن نقدم تقارير مفتوحة الوصول لتعرف بالضبط أين يتم توجيه مساهماتك في الوقت الفعلي.
about.community_title=المجتمع
about.community_desc=التغيير يحدث معاً. نحن نعزز نظاماً عالمياً للمتبرعين والمتطوعين والناشطين المحليين.
about.accountability_title=المساءلة
about.accountability_desc=نحن نفحص بدقة كل منظمة ومشروع لضمان المعايير الأخلاقية والنتائج المستدامة طويلة المدى.
about.cta_title=هل أنت مستعد لإحداث تأثير؟
about.cta_desc=انضم إلى مهمتنا وابدأ رحلة العطاء الشفاف اليوم. أنشئ حسابك واكتشف القضايا التي تهمك.
about.join=انضم إلى مهمتنا

