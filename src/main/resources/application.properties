# ===== SERVEUR =====
server.port=8080
spring.application.name=charite-app
# ===== BASE DE DONNEES POSTGRESQL (dev) =====
# Utilise H2 pour le dev local, remplace par PostgreSQL pour la prod
spring.datasource.url=jdbc:h2:mem:charite;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# ===== MONGODB =====
spring.data.mongodb.uri=mongodb://localhost:27017/charite
spring.data.mongodb.database=charite
# ===== THYMELEAF =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
# ===== UPLOAD DE FICHIERS =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=uploads/
# ===== GOOGLE OAUTH 2.0 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# ===== STRIPE (mode test) =====
stripe.api.key=${STRIPE_TEST_SK}
stripe.publishable.key=${STRIPE_TEST_PK}
# ===== EMAIL (Gmail SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ===== LOGGING =====
logging.level.com.charite=DEBUG
logging.level.org.springframework.security=DEBUG

